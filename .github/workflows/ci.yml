name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for rasterio/geopandas
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev
      - run: pip install -r requirements.txt
      - name: Tests (includes API and dashboard smoke tests)
        run: python -m pytest tests -q -rfE --tb=line -p no:cacheprovider 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Surface failures as annotations
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)|Error" pytest.log | head -25 | while read -r line; do echo "::error::${line:0:400}"; done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
